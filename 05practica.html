
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CREDIELEKTRA</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="estilos.css">
</head>

<body class="container py-4 bg-light">

  <div class="text-center mb-4">
    <img src="img/logoelektra.webp" alt="Logo Elektra" width="200" class="img-fluid">
    <h1 class="text-danger fw-bold mt-2">CREDIELEKTRA</h1>
  </div>

  <hr/>

  <div class="card shadow p-4">

    <h3 class="text-danger">Producto:</h3>
    <br>

    <select id="producto" class="form-select mb-3" onchange="calcular()">
      <option value="refrigerador">REFRIGERADOR</option>
      <option value="bicicleta">BICICLETA</option>
      <option value="moto">MOTO</option>
      <option value="celular">CELULAR</option>
      <option value="sala">SALA</option> 
    </select>

    <div id="img" class="text-center my-3"></div>

    <div id="precio" class="alert alert-info fw-bold text-center">
      Precio: $0.00 MXN
    </div>

    <hr/>

    <h3 class="text-danger">Plazo</h3>

    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="´plazo" id="uno" onchange="calcular()" checked/>
      <label class="form-check-label" for="uno">6 Meses (+10%)</label>
    </div>

    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="´plazo" id="dos" onchange="calcular()" />
      <label class="form-check-label" for="dos">12Meses (+15%)</label>
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="radio" name="´plazo" id="tres" onchange="calcular()" />
      <label class="form-check-label" for="tres">18 Meses (+20%)</label>
    </div>

    <h3 class="text-danger">Cantidad</h3>

    <input
      type="number"
      value="1"
      min="1"
      max="10"
      id="cantidad"
      class="form-control mb-4"
      onchange="calcular()">

    <div id="contado" class="alert alert-secondary">
      Precio de Contado: $ 0.00mx
    </div>

    <div id="credito" class="alert alert-warning">
      Precio a Credito: $ 0.00mx
    </div>

    <div id="abono" class="alert alert-success">
      Abono Mensual: $ 0.00mx
    </div>

  </div>

  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
